<div class="flex items-center justify-between mb-4">
  <h1 class="text-3xl font-semibold m-0">Tickets</h1>
  <button matFab extended [routerLink]="['/tickets', 'new']">
    <mat-icon>add</mat-icon>Crear ticket
  </button>
</div>

<app-ticket-filters
  [initialValues]="initialFilterValues()"
  [resetTrigger]="resetTrigger()"
  [viewMode]="viewMode()"
  (filtersChange)="onFiltersChange($event)"
  (viewModeChange)="viewMode.set($event)"
/>

@if (viewMode() === 'cards') {
  <app-ticket-cards
    [tickets]="store.tickets()"
    [loading]="store.loading()"
    [error]="store.error()"
    [total]="store.total()"
    [pageSize]="store.params().pageSize ?? 10"
    [page]="store.params().page ?? 1"
    [skeletonCards]="skeletonCards()"
    (retryClicked)="retry()"
    (pageChanged)="handlePageEvent($event)"
  />
}

<!-- Table view -->
@if (viewMode() === 'table') {
  <app-ticket-table
    [tickets]="store.tickets()"
    [loading]="store.loading()"
    [error]="store.error()"
    [total]="store.total()"
    [pageSize]="store.params().pageSize ?? 10"
    [page]="store.params().page ?? 1"
    [skeletonData]="skeletonData()"
    (retryClicked)="retry()"
    (pageChanged)="handlePageEvent($event)"
    (sortChanged)="sortChange($event)"
  />
}
