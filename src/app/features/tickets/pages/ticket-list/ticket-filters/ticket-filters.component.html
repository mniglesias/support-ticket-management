<div [formGroup]="filtersForm" class="mb-5">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div class="flex items-center gap-3 w-full md:w-auto">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="flex-grow md:w-72">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          formControlName="search"
          placeholder="Buscar título o desc..."
          data-cy="search-input"
        />
        @if (filtersForm.get('search')?.value) {
          <button
            matIconButton
            matSuffix
            (click)="filtersForm.get('search')?.setValue('')"
            aria-label="Clear"
          >
            <mat-icon>close</mat-icon>
          </button>
        }
      </mat-form-field>

      <button
        matIconButton
        matTooltip="Filtros avanzados"
        (click)="toggleFilters()"
        [class.bg-gray-100]="showFilters()"
        class="rounded-full transition-colors"
        data-cy="filters-toggle"
      >
        <mat-icon>{{ showFilters() ? 'expand_less' : 'tune' }}</mat-icon>
      </button>
    </div>

    <mat-button-toggle-group
      [value]="viewMode()"
      (change)="viewModeChange.emit($event.value)"
      aria-label="Modo de visualización"
    >
      <mat-button-toggle value="cards" matTooltip="Vista de cards">
        <mat-icon>grid_view</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle value="table" matTooltip="Vista de tabla">
        <mat-icon>table_rows</mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  @if (showFilters()) {
    <mat-card appearance="outlined" class="mt-5">
      <mat-card-content>
        <div class="flex flex-col md:flex-row flex-wrap items-start md:items-center gap-4">
          <mat-form-field appearance="fill" subscriptSizing="dynamic" class="w-full md:w-48">
            <mat-label>Estado</mat-label>
            <mat-select formControlName="status" multiple data-cy="filter-status">
              <mat-option value="OPEN">OPEN</mat-option>
              <mat-option value="IN_PROGRESS">IN_PROGRESS</mat-option>
              <mat-option value="DONE">DONE</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="fill" subscriptSizing="dynamic" class="w-full md:w-48">
            <mat-label>Prioridad</mat-label>
            <mat-select formControlName="priority" multiple>
              <mat-option value="LOW">LOW</mat-option>
              <mat-option value="MEDIUM">MEDIUM</mat-option>
              <mat-option value="HIGH">HIGH</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="fill" subscriptSizing="dynamic" class="w-full md:w-48">
            <mat-label>Categoría</mat-label>
            <mat-select formControlName="category" multiple>
              <mat-option value="BILLING">BILLING</mat-option>
              <mat-option value="TECH">TECH</mat-option>
              <mat-option value="OTHER">OTHER</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="fill" subscriptSizing="dynamic" class="w-full md:w-48">
            <mat-label>Responsable</mat-label>
            <mat-select formControlName="assignee" multiple>
              <mat-option value="Ana García">Ana García</mat-option>
              <mat-option value="Carlos López">Carlos López</mat-option>
              <mat-option value="María Rodríguez">María Rodríguez</mat-option>
              <mat-option value="Jorge Fernández">Jorge Fernández</mat-option>
              <mat-option value="Soporte Técnico">Soporte Técnico</mat-option>
            </mat-select>
          </mat-form-field>

          <button
            mat-stroked-button
            color="warn"
            (click)="clearFilters()"
            [disabled]="!hasActiveFilters()"
          >
            <mat-icon>filter_alt_off</mat-icon> Limpiar
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  }
</div>
