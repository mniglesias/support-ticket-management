<div class="flex flex-col h-screen overflow-hidden">
  <mat-toolbar class="z-50 shadow-sm app-toolbar shrink-0 bg-white">
    <span class="text-lg font-semibold tracking-wide">Gestor de Tickets</span>

    <span class="flex-1"></span>

    <button mat-icon-button (click)="themeService.toggle()">
      <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </mat-toolbar>

  <main
    class="flex-1 overflow-y-auto p-4"
    style="background: var(--mat-sys-surface-container-lowest)"
  >
    <router-outlet />
  </main>
</div>
